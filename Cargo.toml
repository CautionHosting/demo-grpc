[package]
name = "caution-grpc-hello"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "grpc-hello-server"
path = "src/main.rs"

[[bin]]
name = "grpc-hello-client"
path = "src/bin/grpc-hello-client.rs"

[dependencies]
hyper-util = { version = "=0.1.20", features = ["tokio"] }
prost = "=0.13.5"
tokio = { version = "=1.47.1", features = ["macros", "net", "rt-multi-thread"] }
tonic = { version = "=0.12.3", features = ["tls-webpki-roots"] }
tower = { version = "=0.4.13", features = ["util"] }

[build-dependencies]
protoc-bin-vendored = "=3.2.0"
tonic-build = "=0.12.3"
